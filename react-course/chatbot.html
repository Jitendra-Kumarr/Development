<!DOCTYPE html>
<html>
  <head>
    <title>ChatBot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="react-basics.js">
        
    </script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">

      function ChatInput(){
        return (
          <> 
            <input placeholder="Send a message to ChatBot" size="30" /> 
            <button> Send </button>
          </>
        )
      }

      function ChatMessage(props){
        const message = props.message; 
        const sender = props.sender;

        // const {message, sender} = props; 

        // if(sender === 'Priyanshu'){
        //   return (
        //     <div> 
        //       <img src="priyanshu.png" width="40" style={{borderRadius: '50%', objectFit: 'cover'}}  />
        //       {message}
        //     </div>
        //   )
        // }

        return (
          <div>
              {sender === "Priyanshu" && <img src="priyanshu.png" width="40" style={{borderRadius: '50%', objectFit: 'cover'}}  />}
              {message}
              {sender === "user" && <img src="user.jpeg" width="60" />}
          </div>
        )
      }

      function App(){
        return (
          <> 
            <ChatInput />
            <ChatMessage message="Hello, Priyanshu" sender="user" />
            <ChatMessage message="Hello! How can i help you?" sender="Priyanshu" />
            <ChatMessage message="can you get me today's date?" sender="user" />
            <ChatMessage message="Todays date is 28 oct 2026" sender="Priyanshu" />
          </>
        );
      }
 
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App> </App>);
    </script>

  </body>
</html>
